<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 454" role="img" aria-labelledby="title desc">
  <title id="title">Paired A/B results</title>
  <desc id="desc">Paired Baseline and zvec-grep Treatment results. Answer quality is shown directly; separate efficiency bars show relative resource use.</desc>
  <style>
    .canvas { fill: transparent; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .rule { stroke: #d0d7de; }
    .baseline { fill: #afb8c1; }
    .treatment { fill: #2da44e; }
    .gain { fill: #1a7f37; }
    .number { font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: transparent; }
      .panel { fill: #161b22; stroke: #30363d; }
      .text { fill: #f0f6fc; }
      .muted { fill: #9da7b3; }
      .rule { stroke: #30363d; }
      .baseline { fill: #6e7681; }
      .treatment { fill: #3fb950; }
      .gain { fill: #56d364; }
    }
  </style>
  <rect class="canvas" width="1200" height="454" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text class="text" x="0" y="29" font-size="24" font-weight="700">Paired A/B results</text>
    <rect class="treatment" x="0" y="54" width="20" height="8" rx="4" />
    <text class="muted" x="28" y="63" font-size="13">Treatment (zvec-grep)</text>
    <rect class="baseline" x="220" y="54" width="20" height="8" rx="4" />
    <text class="muted" x="248" y="63" font-size="13">Baseline</text>
    <text class="muted" x="1200" y="63" font-size="14" text-anchor="end">The bars compare zvec-grep&#x27;s resource use with the Baseline.</text>
    <g aria-label="SWE-QA-Bench">
      <rect class="panel" x="0.0" y="96" width="590.0" height="358" rx="14" />
      <text class="text" x="26.0" y="130" font-size="21" font-weight="700">SWE-QA-Bench</text>
      <text class="muted" x="26.0" y="152" font-size="13">20 tasks · Codebase QA</text>
      <line class="rule" x1="26.0" y1="170" x2="564.0" y2="170" />
      <text class="muted" x="26.0" y="201" font-size="14">Judge score</text>
      <text class="text number" x="459.0" y="201" font-size="18" font-weight="700" text-anchor="end">80.42<tspan class="muted" font-weight="400"> → </tspan><tspan class="gain">81.92</tspan></text>
      <text class="gain number" x="564.0" y="201" font-size="15" font-weight="700" text-anchor="end">+1.50 pts</text>
      <line class="rule" x1="26.0" y1="222" x2="564.0" y2="222" />
      <text class="text" x="26.0" y="247" font-size="14" font-weight="600">Input tokens</text>
      <text class="gain number" x="564.0" y="247" font-size="17" font-weight="700" text-anchor="end">−47.3%</text>
      <rect class="treatment" x="26.0" y="255" width="283.5" height="14" rx="7" />
      <rect class="baseline" x="26.0" y="276" width="538.0" height="14" rx="7" />
      <text class="text" x="26.0" y="317" font-size="14" font-weight="600">Tool calls</text>
      <text class="gain number" x="564.0" y="317" font-size="17" font-weight="700" text-anchor="end">−58.6%</text>
      <rect class="treatment" x="26.0" y="325" width="222.7" height="14" rx="7" />
      <rect class="baseline" x="26.0" y="346" width="538.0" height="14" rx="7" />
      <text class="text" x="26.0" y="387" font-size="14" font-weight="600">Agent time</text>
      <text class="gain number" x="564.0" y="387" font-size="17" font-weight="700" text-anchor="end">−37.5%</text>
      <rect class="treatment" x="26.0" y="395" width="336.2" height="14" rx="7" />
      <rect class="baseline" x="26.0" y="416" width="538.0" height="14" rx="7" />
    </g>
    <g aria-label="BrowseComp-Plus">
      <rect class="panel" x="610.0" y="96" width="590.0" height="358" rx="14" />
      <text class="text" x="636.0" y="130" font-size="21" font-weight="700">BrowseComp-Plus</text>
      <text class="muted" x="636.0" y="152" font-size="13">80 cases · Deep-research QA</text>
      <line class="rule" x1="636.0" y1="170" x2="1174.0" y2="170" />
      <text class="muted" x="636.0" y="201" font-size="14">Accuracy</text>
      <text class="text number" x="1174.0" y="201" font-size="18" font-weight="700" text-anchor="end">90.00%<tspan class="muted" font-weight="400"> → </tspan><tspan class="text">90.00%</tspan></text>
      <line class="rule" x1="636.0" y1="222" x2="1174.0" y2="222" />
      <text class="text" x="636.0" y="247" font-size="14" font-weight="600">Input tokens</text>
      <text class="gain number" x="1174.0" y="247" font-size="17" font-weight="700" text-anchor="end">−41.7%</text>
      <rect class="treatment" x="636.0" y="255" width="313.7" height="14" rx="7" />
      <rect class="baseline" x="636.0" y="276" width="538.0" height="14" rx="7" />
      <text class="text" x="636.0" y="317" font-size="14" font-weight="600">Tool calls</text>
      <text class="gain number" x="1174.0" y="317" font-size="17" font-weight="700" text-anchor="end">−37.3%</text>
      <rect class="treatment" x="636.0" y="325" width="337.3" height="14" rx="7" />
      <rect class="baseline" x="636.0" y="346" width="538.0" height="14" rx="7" />
      <text class="text" x="636.0" y="387" font-size="14" font-weight="600">Agent time</text>
      <text class="gain number" x="1174.0" y="387" font-size="17" font-weight="700" text-anchor="end">−30.0%</text>
      <rect class="treatment" x="636.0" y="395" width="376.6" height="14" rx="7" />
      <rect class="baseline" x="636.0" y="416" width="538.0" height="14" rx="7" />
    </g>
  </g>
</svg>
