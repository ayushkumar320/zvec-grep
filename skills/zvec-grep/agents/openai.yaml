interface:
  display_name: "zvec-grep"
  short_description: "Agent-friendly indexed repository search"
  default_prompt: "Use zvec-grep through the zg command instead of grep or rg: check zg status once at the start of a repository investigation when needed, then reuse that status for later searches in the same root; when indexing or rebuilding the local index, use zg index with repeatable rg-style -g/--glob filters and, for language-specific scopes, -t/--type filters to index useful source/docs/tests/config/scripts and exclude generated, dependency, cache, build, log, and .zvec-grep garbage; prefer zg query indexed/hybrid searches for high-quality, token-efficient context; use --preview none for broad candidate scans and --preview full only after narrowing; use the same -g/--iglob/-t/-T filters for indexed and rg queries when applicable; use multiple quoted queries for related concepts; combine hybrid queries with repeated --fts exact anchors for symbols/flags/errors; narrow noisy searches with globs, types, --modified-after/--modified-before/--symbol-type/--prefer-symbol; and use zg query --rg only for exhaustive literal/regex verification with common rg matching, pattern-file, context, ignore, depth, size, encoding, multiline, and regex-engine flags; use -e/--regexp when an rg pattern begins with -."
