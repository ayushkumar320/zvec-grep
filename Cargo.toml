[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/zg"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/zvec-ai/zvec-grep"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8"
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.47", features = ["derive", "env"] }
futures = "0.3.34"
globset = "0.4.19"
grep = "0.4.1"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
ignore = "0.4.33"
notify = "8.2.0"
rmcp = { version = "3.1.4", features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
same-file = "1.0.6"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sse-stream = "0.2.5"
sysinfo = "0.37"
tempfile = "3.27.0"
thiserror = "2.0.16"
tokio = "1.47.1"
tokio-util = "0.7.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-spawn = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
